name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day (midnight UTC)
  workflow_dispatch:        # lets you also run it manually
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: sreeram0242-bot
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ffffff&color_dots=%23000000,%23ffffff,%23ffffff,%23ffffff,%23ffffff

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
